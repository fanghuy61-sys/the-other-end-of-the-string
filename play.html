<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191317"><title>Play · The Other End of the String</title><link rel="icon" href="stage.icon.png"><link rel="stylesheet" href="player.css"></head>
<body>
