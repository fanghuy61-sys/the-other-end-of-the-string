name: Publish the v0.20 browser files
on:
  push:
    paths: ['.github/workflows/import-web.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify the release and publish the English game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view v0.20 >/dev/null 2>&1; then exit 0; fi
          file=TheOtherEnd-v0.20-Web.zip
          gh release download v0.20 --pattern "$file" --dir "$RUNNER_TEMP"
          echo "f6c9a5515fe30b5f6dbe5c97e4a867f85ed174979962a53ce52f98aef544c328  $RUNNER_TEMP/$file" | sha256sum --check
          unzip -o -q "$RUNNER_TEMP/$file"
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish complete v0.20 browser game and English exhibition'
          git push origin HEAD:main
